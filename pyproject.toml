[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "layer-analytic-generator"
version = "2.0.0"
description = "Build weighted ATT&CK Navigator layers and analytic plans from MITRE ATT&CK Group, Software, and Campaign IDs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "markdown>=3.5",
]

[project.optional-dependencies]
llm = ["anthropic>=1.8"]
dev = ["pytest>=8", "ruff>=0.6", "anthropic>=1.8"]

[project.scripts]
lag = "lag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests that download live data from the internet (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
